<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exclusive Bake Invoice</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root { --pink:#e8457a; --line:#f3a9bd; --ink:#3d3d3d; --muted:#6b6b6b; --bg:#f6f4f5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); font-family:'Lato',-apple-system,Helvetica,Arial,sans-serif; color:var(--ink); -webkit-text-size-adjust:100%; }
  .wrap { max-width:640px; margin:0 auto; padding:0 14px 40px; }
  .hero { background:#fff; }
  .hero img.banner { display:block; width:100%; height:auto; }
  .hero img.logo { display:block; width:min(260px,70%); margin:-4px auto 6px; }
  .biz { text-align:center; font-size:14px; color:var(--muted); padding:0 14px 14px; line-height:1.5; }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.06em; color:var(--pink); margin:24px 0 10px; }
  .card { background:#fff; border-radius:14px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  label { display:block; font-size:13px; font-weight:700; margin:0 0 5px; }
  .field { margin-bottom:12px; }
  .field:last-child { margin-bottom:0; }
  input, textarea { width:100%; font:inherit; font-size:16px; color:var(--ink); background:#fff;
    border:1px solid #d9d4d7; border-radius:10px; padding:11px 12px; -webkit-appearance:none; appearance:none; }
  input:focus, textarea:focus { outline:none; border-color:var(--pink); box-shadow:0 0 0 3px rgba(232,69,122,.15); }
  input[readonly] { background:#f4f2f3; color:var(--muted); }
  textarea { resize:vertical; min-height:96px; }
  .row2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
  .row2 > * { min-width:0; }
  input[type=date] { min-height:46px; display:block; }
  .line { position:relative; border:1px solid #eee; border-radius:12px; padding:12px; margin-bottom:10px; }
  .line textarea { min-height:70px; }
  .line .amt { text-align:right; font-weight:700; margin-top:8px; font-size:15px; }
  .line .rm { position:absolute; top:6px; right:8px; border:0; background:none; color:#aaa; font-size:22px; line-height:1; padding:4px 6px; }
  .line .num { font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:700; }
  .btn { display:block; width:100%; font:inherit; font-size:16px; font-weight:700; border-radius:12px; padding:14px; border:1px solid #d9d4d7;
    background:#fff; color:var(--ink); cursor:pointer; text-align:center; text-decoration:none; -webkit-appearance:none; }
  .btn.primary { background:var(--pink); border-color:var(--pink); color:#fff; }
  .btn:disabled { opacity:.6; }
  .btn + .btn { margin-top:10px; }
  .totals .t { display:flex; justify-content:space-between; padding:5px 0; font-size:15px; }
  .totals .due { border-top:2px solid var(--line); margin-top:8px; padding-top:10px; font-size:19px; font-weight:700; }
  .notes { font-size:14px; line-height:1.5; }
  .status { font-size:14px; color:var(--muted); margin-top:10px; text-align:center; min-height:1em; }
  #ready { display:none; margin-top:12px; }
  .pv { overflow:hidden; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.1); background:#fff; }
  .pv-inner { width:794px; transform-origin:top left; }

  /* A4 sheet used for the preview and the PDF */
  .sheet { position:relative; width:794px; min-height:1123px; background:#fff; overflow:hidden; font-size:13px; line-height:1.55; font-family:'Lato',Helvetica,Arial,sans-serif; color:var(--ink); }
  .sheet .banner { display:block; width:100%; height:auto; }
  .sheet .bubble { position:absolute; border-radius:50%; z-index:0; opacity:.75; }
  .sheet .content { position:relative; z-index:1; padding:0 36px 40px; }
  .sheet .logo { display:block; width:330px; margin:-6px auto 6px; position:relative; left:70px; }
  .sheet .top { display:flex; justify-content:space-between; align-items:flex-start; }
  .sheet .inv { text-align:right; }
  .sheet h1 { margin:6px 0 8px; font-size:26px; color:#555; }
  .sheet .meta { display:grid; grid-template-columns:auto 130px; gap:2px 18px; text-align:right; }
  .sheet .k { font-weight:700; }
  .sheet .rule { border:0; border-top:1px solid #e6e6e6; margin:28px -36px 22px; }
  .sheet .billto { display:grid; grid-template-columns:100px 1fr; min-height:100px; }
  .sheet .pre { white-space:pre-wrap; }
  .sheet table { width:calc(100% + 36px); margin:30px 0 0; border-collapse:collapse; }
  .sheet th { font-weight:700; text-align:left; padding:10px 0; border-top:2px solid var(--line); border-bottom:2px solid var(--line); }
  .sheet td { padding:12px 0 22px; vertical-align:top; border-bottom:1px solid #eee; }
  .sheet .r { text-align:right; } .sheet .c { text-align:center; }
  .sheet .lastcol { padding-right:36px; }
  .sheet .tot { margin:28px -36px 0 auto; width:420px; }
  .sheet .tot div { display:grid; grid-template-columns:1fr 150px; padding:4px 36px 4px 0; text-align:right; }
  .sheet .tot div span:first-child { padding-right:26px; }
  .sheet .tot .gap { height:14px; padding:0; }
  .sheet .tot .bd { border-top:2px solid var(--line); border-bottom:2px solid var(--line); margin-top:6px; padding-top:8px; padding-bottom:8px; font-size:21px; font-weight:700; }
  .sheet .notes2 { margin-top:60px; }
  #pdfHolder { position:absolute; left:-10000px; top:0; width:794px; }
</style>
</head>

<div class="wrap">

      <div class="field"><label for="paid">Paid (R)</label><input id="paid" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>

<script>
var BIZ = { address:'140 Golf Ave, Clubview West, 0157, South Africa', phone:'069 449 3993', email:'theresasoko@icloud.com',
  notes:'FNB, Exclusive bake, acc no: 62563279267, Branch: 250655' };
var LOGO = document.querySelector('.hero .logo').src, BANNER = document.querySelector('.hero .banner').src;
var LS = 'exclusiveBakeInvoice.mobile.v1';
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function num(s){
  s = String(s || '').replace(/[R\s ]/gi, '');
  if (s.indexOf(',') >= 0 && s.indexOf('.') < 0) s = s.replace(/,/g, '.'); else s = s.replace(/,/g, '');
  var v = parseFloat(s); return isNaN(v) ? 0 : v;
}
function money(n){
  var neg = n < 0, p = Math.abs(Math.round(n * 100) / 100).toFixed(2).split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '-R ' : 'R ') + p[0] + '.' + p[1];
}
function slashDate(iso){ return iso ? iso.replace(/-/g, '/') : ''; }

$('bizText').innerHTML = esc(BIZ.address) + '<br>' + esc(BIZ.phone) + '<br>' + esc(BIZ.email);
$('notesText').textContent = BIZ.notes;

function addLine(item){
  item = item || {desc:'', qty:'', rate:''};
  var d = document.createElement('div'); d.className = 'card line';
  d.innerHTML = '<div class="num"></div><button class="rm" type="button" aria-label="Remove item">&times;</button>' +
    '<div class="field"><label>Description</label><textarea class="desc" rows="3" placeholder="e.g. Celebration cake, flavour, theme"></textarea></div>' +
    '<div class="row2"><div class="field"><label>Quantity</label><input class="qty" inputmode="decimal" placeholder="1" autocomplete="off"></div>' +
    '<div class="field"><label>Price (R)</label><input class="rate" inputmode="decimal" placeholder="0.00" autocomplete="off"></div></div>' +
    '<div class="amt">Amount: <span>R 0.00</span></div>';
  d.querySelector('.desc').value = item.desc; d.querySelector('.qty').value = item.qty; d.querySelector('.rate').value = item.rate;
  d.querySelector('.rm').addEventListener('click', function(){
    d.parentNode.removeChild(d); if (!document.querySelector('.line')) addLine(); update();
  });
  $('lines').appendChild(d);
}
function state(){
  var items = [];
  var ls = document.querySelectorAll('.line');
  for (var i = 0; i < ls.length; i++) items.push({ desc: ls[i].querySelector('.desc').value, qty: ls[i].querySelector('.qty').value, rate: ls[i].querySelector('.rate').value });
  return { invNo:$('invNo').value, invDate:$('invDate').value, terms:$('terms').value, billTo:$('billTo').value,
    vatPct:$('vatPct').value, paid:$('paid').value, items:items };
}
function save(s){ try { localStorage.setItem(LS, JSON.stringify(s)); } catch(e){} }
function load(){ try { return JSON.parse(localStorage.getItem(LS)); } catch(e){ return null; } }

function compute(s){
  var sub = 0, rows = [];
  s.items.forEach(function(it){
    var q = num(it.qty), r = num(it.rate), a = q * r;
    if (it.desc.trim() || it.qty.trim() || it.rate.trim()) rows.push({ desc:it.desc, qty:it.qty.trim(), rate:it.rate.trim() ? money(r) : '', amt:(it.qty.trim() || it.rate.trim()) ? money(a) : '' });
    sub += a;
  });
  var vp = num(s.vatPct), vat = sub * vp / 100, tot = sub + vat, paid = num(s.paid);
  var due = '';
  if (s.invDate) { var p = s.invDate.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]); d.setDate(d.getDate() + Math.round(num(s.terms)));
    due = d.getFullYear() + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + ('0' + d.getDate()).slice(-2); }
  return { rows:rows, sub:sub, vp:vp, vat:vat, tot:tot, paid:paid, bal:tot - paid, due:due };
}

function sheetHTML(s, c){
  var rows = c.rows.map(function(r){
    return '<tr><td class="pre">' + esc(r.desc) + '</td><td class="c">' + esc(r.qty) + '</td><td class="r">' + r.rate + '</td><td class="r lastcol">' + r.amt + '</td></tr>';
  }).join('');
  return '<div class="sheet">' +
    '<img class="banner" src="' + BANNER + '">' +
    '<div class="bubble" style="width:210px;height:210px;left:150px;top:660px;background:#eef3f3"></div>' +
    '<div class="bubble" style="width:120px;height:120px;left:388px;top:790px;background:#f0f3f4"></div>' +
    '<div class="bubble" style="width:230px;height:230px;left:-30px;top:870px;background:#f3eff6"></div>' +
    '<div class="bubble" style="width:110px;height:110px;left:262px;top:870px;background:#f6f1ef"></div>' +
    '<div class="bubble" style="width:180px;height:180px;left:262px;top:990px;background:#f7f2f0"></div>' +
    '<div class="content"><img class="logo" src="' + LOGO + '">' +
    '<div class="top"><div>' + esc(BIZ.address) + '<br>' + esc(BIZ.phone) + '<br>' + esc(BIZ.email) + '</div>' +
    '<div class="inv"><h1>Invoice</h1><div class="meta">' +
    '<span class="k">Invoice No:</span><span>' + esc(s.invNo) + '</span>' +
    '<span class="k">Date:</span><span>' + slashDate(s.invDate) + '</span>' +
    '<span class="k">Terms:</span><span>NET ' + Math.round(num(s.terms)) + '</span>' +
    '<span class="k">Due Date:</span><span>' + c.due + '</span></div></div></div>' +
    '<hr class="rule"><div class="billto"><span class="k">Bill To:</span><div class="pre">' + esc(s.billTo) + '</div></div>' +
    '<table><thead><tr><th style="width:46%">Description</th><th class="c" style="width:14%">Quantity</th><th class="r" style="width:18%">Rate</th><th class="r lastcol" style="width:22%">Amount</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="tot"><div><span>Subtotal</span><span>' + money(c.sub) + '</span></div>' +
    '<div><span>VAT ' + c.vp + '%</span><span>' + money(c.vat) + '</span></div>' +
    '<div><span>Total</span><span>' + money(c.tot) + '</span></div><div class="gap"></div>' +
    '<div><span>Paid</span><span>' + money(c.paid) + '</span></div>' +
    '<div class="bd"><span>Balance Due</span><span>' + money(c.bal) + '</span></div></div>' +
    '<div class="notes2"><div class="k">Notes</div><div>' + esc(BIZ.notes) + '</div></div>' +
    '</div></div>';
}

var pdfBlob = null, pdfUrl = null, pdfName = '';
function clearPdf(){
  if (pdfUrl) { try { URL.revokeObjectURL(pdfUrl); } catch(e){} }
  pdfBlob = null; pdfUrl = null; $('ready').style.display = 'none'; $('makePdf').style.display = '';
}
function fitPreview(){
  var w = $('pv').clientWidth, sc = w / 794, inner = $('pvInner');
  inner.style.transform = 'scale(' + sc + ')';
  var sh = inner.firstChild; $('pv').style.height = (sh ? sh.offsetHeight * sc : 0) + 'px';
}
function update(){
  var s = state(), c = compute(s);
  var ls = document.querySelectorAll('.line');
  for (var i = 0; i < ls.length; i++) {
    ls[i].querySelector('.num').textContent = 'Item ' + (i + 1);
    var q = num(ls[i].querySelector('.qty').value), r = num(ls[i].querySelector('.rate').value);
    ls[i].querySelector('.amt span').textContent = money(q * r);
  }
  $('dueDate').value = c.due;
  $('sub').textContent = money(c.sub); $('vatLbl').textContent = 'VAT ' + c.vp + '%'; $('vat').textContent = money(c.vat);
  $('tot').textContent = money(c.tot); $('paidOut').textContent = money(c.paid); $('bal').textContent = money(c.bal);
  $('pvInner').innerHTML = sheetHTML(s, c); fitPreview();
  save(s); clearPdf(); $('status').textContent = '';
}

// init
(function(){
  var s = load();
  if (s && s.items) {
    $('invNo').value = s.invNo || ''; $('invDate').value = s.invDate || ''; $('terms').value = s.terms || '';
    $('billTo').value = s.billTo || ''; $('vatPct').value = s.vatPct || ''; $('paid').value = s.paid || '';
    (s.items.length ? s.items : [null]).forEach(addLine);
  } else addLine();
  update();
})();

document.addEventListener('input', update);
document.addEventListener('change', update);
window.addEventListener('resize', fitPreview);
$('pvInner').addEventListener('load', fitPreview, true);
$('addLine').addEventListener('click', function(){ addLine(); update(); });
$('reset').addEventListener('click', function(){
  if (!window.confirm || window.confirm('Clear everything you have entered?')) {
    ['invNo','invDate','terms','billTo','vatPct','paid'].forEach(function(id){ $(id).value = ''; });
    $('lines').innerHTML = ''; addLine(); update(); window.scrollTo(0, 0);
  }
});

$('makePdf').addEventListener('click', function(){
  var btn = $('makePdf'); btn.disabled = true; $('status').textContent = 'Creating PDF…';
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  var s = state(), c = compute(s), holder = $('pdfHolder');
  holder.innerHTML = sheetHTML(s, c);
  var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  ready.then(function(){
    return html2canvas(holder.firstChild, { scale:2, backgroundColor:'#ffffff', width:794, windowWidth:794, logging:false });
  }).then(function(canvas){
    holder.innerHTML = '';
    var pdf = new window.jspdf.jsPDF({ unit:'mm', format:'a4' });
    var pw = 210, ph = 297, ih = canvas.height * pw / canvas.width, img = canvas.toDataURL('image/jpeg', 0.9), y = 0;
    do { if (y > 0) pdf.addPage(); pdf.addImage(img, 'JPEG', 0, -y, pw, ih); y += ph; } while (y < ih - 2);
    var client = (s.billTo.split('\n')[0] || '').trim().replace(/[^\w\- ]+/g, '').slice(0, 40);
    pdfName = 'Exclusive Bake Invoice' + (s.invNo.trim() ? ' ' + s.invNo.trim().replace(/[^\w\-]+/g, '') : '') + (client ? ' - ' + client : '') + '.pdf';
    pdfBlob = pdf.output('blob');
    pdfUrl = URL.createObjectURL(pdfBlob);
    var a = $('openLink'); a.href = pdfUrl; a.setAttribute('download', pdfName);
    var canShare = false;
    try { canShare = !!(navigator.canShare && navigator.canShare({ files:[new File([pdfBlob], pdfName, { type:'application/pdf' })] })); } catch(e){}
    $('shareBtn').style.display = canShare ? '' : 'none';
    a.textContent = canShare ? 'Download PDF' : 'Download PDF';
    btn.style.display = 'none'; $('ready').style.display = 'block';
    $('status').textContent = 'Your PDF is ready.';
  }).catch(function(e){
    holder.innerHTML = '';
    $('status').textContent = 'Could not create the PDF. Please check your internet connection and try again.';
  }).then(function(){ btn.disabled = false; });
});

$('shareBtn').addEventListener('click', function(){
  if (!pdfBlob) return;
  var f = new File([pdfBlob], pdfName, { type:'application/pdf' });
  navigator.share({ files:[f], title:pdfName }).catch(function(e){
    if (e && e.name !== 'AbortError') $('status').textContent = 'Sharing did not work here. Use Download PDF instead.';
  });
});
</script>
